[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sideral-multimodels-05"
version = "0.1.0"
description = "Protótipo independente de consenso multimodelo global em grade de 0,5 grau para Sideral Meteorologia."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sideral Meteorologia Sistemas"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "cfgrib>=0.9.14",
  "eccodes>=1.6",
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "ecmwf-opendata>=0.3.20",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sideral-multimodels = "sideral_multimodels.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sideral_multimodels*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
