name: CPTEC Nowcasting — teste imediato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cptec-nowcasting-collector.yml"
      - "scripts/cptec_nowcasting_collector.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  collect:
    name: Testar coletor CPTEC em uma máquina
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência HTTP
        run: python -m pip install --disable-pip-version-check requests

      - name: Descobrir e coletar todos os quadros anunciados pela API
        id: collect
        continue-on-error: true
        env:
          CPTEC_OUTPUT_DIR: cptec-nowcasting-output
          CPTEC_DOWNLOAD_WORKERS: "12"
          CPTEC_REQUEST_TIMEOUT: "25"
          CPTEC_SHARD_INDEX: "0"
          CPTEC_SHARD_COUNT: "1"
        run: python scripts/cptec_nowcasting_collector.py

      - name: Salvar imagens, catálogo e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cptec-nowcasting-test-${{ github.run_number }}
          path: cptec-nowcasting-output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Informar falha da coleta
        if: steps.collect.outcome != 'success'
        run: |
          echo "O coletor terminou com erro. Consulte o artefato para ver discovery.json e errors.json."
          exit 1
